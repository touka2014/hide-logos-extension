<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h3>Privacy Settings</h3>
  
  <!-- Switch 1: Hide Logos -->
  <div class="setting-item">
    <span class="label">Hide Site Logos</span>
    <label class="switch">
      <input type="checkbox" id="toggleSwitchLogo">
      <span class="slider"></span>
    </label>
  </div>

  <!-- Switch 2: Mask Tab -->
  <div class="setting-item">
    <span class="label">Mask Tab Info</span>
    <label class="switch">
      <input type="checkbox" id="toggleSwitchTab">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer-note">
    Refresh page to apply changes
  </div>

  <script src="popup.js"></script>
</body>
</html>
